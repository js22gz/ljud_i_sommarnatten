<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ljud i sommarnatten — fågelanalys</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --panel-2: #18233a;
      --text: #e8eefc;
      --muted: #9db0d3;
      --accent: #6ee7b7;
      --accent-2: #fbbf24;
      --line: rgba(255,255,255,0.08);
      --shadow: 0 18px 50px rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(110,231,183,0.12), transparent 28%),
        radial-gradient(circle at top right, rgba(251,191,36,0.10), transparent 24%),
        linear-gradient(180deg, #08101d 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 64px;
      text-align: center;
    }
    header { margin-bottom: 28px; }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    @media (max-width: 960px) {
      h1 {
        font-size: clamp(0.78rem, 4.2vw, 3.2rem);
      }
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .player-section {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      overflow: visible;
    }
    .card-body { padding: 18px 20px 22px; }

    .player {
      display: grid;
      gap: 14px;
    }
    .audio-hidden {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }
    .wave-wrap {
      position: relative;
      height: 200px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      --scrub-height: 40px;
    }
    #waveCanvas, #timelineCanvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    #playhead {
      position: absolute;
      top: 0;
      bottom: var(--scrub-height);
      width: 2px;
      background: var(--accent-2);
      box-shadow: 0 0 12px rgba(251,191,36,0.8);
      pointer-events: none;
      transform: translateX(0);
      z-index: 3;
    }
    .play-control {
      position: absolute;
      left: 50%;
      top: calc((100% - var(--scrub-height)) / 2);
      translate: -50% -50%;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      background: rgba(8, 16, 29, 0.55);
      backdrop-filter: blur(4px);
      cursor: pointer;
      touch-action: manipulation;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease,
        transform 0.2s ease;
    }
    .wave-wrap:hover .play-control,
    .play-control:focus-visible {
      opacity: 1;
      pointer-events: auto;
    }
    .play-control:hover {
      background: rgba(8, 16, 29, 0.72);
      border-color: rgba(110, 231, 183, 0.35);
      transform: scale(1.04);
    }
    .play-control svg {
      width: 30px;
      height: 30px;
      fill: rgba(232, 238, 252, 0.94);
      filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.35));
    }
    .play-control .icon-pause {
      display: none;
      width: 28px;
      height: 28px;
    }
    .play-control.is-playing .icon-play {
      display: none;
    }
    .play-control.is-playing .icon-pause {
      display: block;
    }
    .scrub-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      height: var(--scrub-height);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 0 44px;
      font-size: 0.82rem;
      color: var(--text);
      background: linear-gradient(to top, rgba(8, 16, 29, 0.88), rgba(8, 16, 29, 0.55));
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      touch-action: none;
    }
    .scrub-bar span {
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      user-select: none;
    }
    .volume-slider {
      position: absolute;
      right: 10px;
      top: 14px;
      bottom: calc(var(--scrub-height) + 10px);
      width: 30px;
      z-index: 7;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: rgba(18, 26, 43, 0.55);
      backdrop-filter: blur(4px);
      border: 1px solid var(--line);
    }
    .volume-track {
      position: relative;
      width: 4px;
      height: calc(100% - 8px);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      touch-action: none;
    }
    .volume-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 999px;
      background: linear-gradient(to top, rgba(110, 231, 183, 0.35), var(--accent));
      pointer-events: none;
    }
    .volume-thumb {
      position: absolute;
      left: 50%;
      width: 14px;
      height: 14px;
      margin: 0;
      padding: 0;
      border: 2px solid rgba(232, 238, 252, 0.92);
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(110, 231, 183, 0.45);
      transform: translate(-50%, 50%);
      cursor: grab;
      touch-action: none;
    }
    .volume-thumb:active { cursor: grabbing; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(18, 26, 43, 0.55);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line);
    }
    .legend-entry {
      position: relative;
    }
    .legend-entry.open {
      z-index: 40;
    }
    .legend-item {
      --highlight-strength: 0;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font: inherit;
      font-size: 1.05rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      transition: color 0.3s ease, background 0.4s ease, border-color 0.4s ease,
        box-shadow 0.4s ease, transform 0.4s ease;
    }
    .legend-item:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.08);
    }
    .legend-entry.open .legend-item {
      border-color: rgba(110, 231, 183, 0.35);
    }
    .legend-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      translate: -50% 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 11.5rem;
      max-width: 16rem;
      max-height: min(320px, 70vh);
      overflow: hidden;
      margin: 0;
      padding: 0;
      list-style: none;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(18, 26, 43, 0.96);
      box-shadow: var(--shadow);
      z-index: 30;
    }
    .legend-menu[hidden] {
      display: none;
    }
    .legend-menu-header {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 8px 8px 10px;
      border-bottom: 1px solid var(--line);
      list-style: none;
    }
    .legend-menu-scroll {
      display: block;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      list-style: none;
      margin: 0;
      padding: 6px;
    }
    .legend-menu-items {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .legend-menu-header[hidden] {
      display: none;
    }
    .legend-menu-photo {
      width: 92px;
      height: 92px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }
    .legend-menu-photo[hidden] {
      display: none;
    }
    .legend-menu-credit {
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.35;
    }
    .legend-menu-credit a {
      color: var(--accent);
      text-decoration: none;
    }
    .legend-menu-credit a:hover {
      text-decoration: underline;
    }
    .legend-menu-item {
      display: block;
      width: 100%;
      font: inherit;
      font-size: 0.88rem;
      color: var(--text);
      text-align: left;
      background: transparent;
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }
    .legend-menu-item:hover,
    .legend-menu-item:focus-visible {
      background: rgba(110, 231, 183, 0.12);
      color: var(--accent);
      outline: none;
    }
    .legend-menu-time {
      font-variant-numeric: tabular-nums;
    }
    .legend-menu-confidence {
      float: right;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .legend-menu-item:hover .legend-menu-confidence,
    .legend-menu-item:focus-visible .legend-menu-confidence {
      color: var(--accent);
    }
    .legend-item.active {
      color: var(--text);
      background: rgba(110, 231, 183, calc(0.06 + var(--highlight-strength) * 0.4));
      border-color: rgba(110, 231, 183, calc(0.15 + var(--highlight-strength) * 0.8));
      box-shadow: 0 0 calc(4px + var(--highlight-strength) * 22px)
        rgba(110, 231, 183, calc(0.1 + var(--highlight-strength) * 0.6));
      transform: scale(calc(1 + var(--highlight-strength) * 0.07));
    }
    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      transition: transform 0.4s ease;
    }
    .legend-item.active .swatch {
      transform: scale(calc(1 + var(--highlight-strength) * 0.25));
    }
    .legend-item.minor {
      font-size: 0.88rem;
      padding: 6px 11px;
      opacity: 0.82;
    }
    .legend-item.minor.active {
      opacity: 1;
    }
    .legend-label {
      display: inline-flex;
      align-items: baseline;
      gap: 0.45rem;
    }
    .legend-confidence {
      display: none;
      font-size: 0.82em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .legend-item.active .legend-confidence {
      display: inline;
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }
    footer a {
      color: var(--accent);
      text-decoration: none;
    }
    footer a:hover { text-decoration: underline; }

    
    body.has-photo-bg {
      background: #08101d;
      isolation: isolate;
    }
    body.has-photo-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translateZ(0);
      pointer-events: none;
    }
    @media (orientation: landscape) {
      body.has-photo-bg::before {
        background-image:
          linear-gradient(180deg, rgba(8, 16, 29, 0.22) 0%, rgba(8, 16, 29, 0.48) 100%),
          url("landscape.jpg");
      }
    }
    @media (orientation: portrait) {
      body.has-photo-bg::before {
        background-image:
          linear-gradient(180deg, rgba(8, 16, 29, 0.22) 0%, rgba(8, 16, 29, 0.48) 100%),
          url("portrait.jpg");
      }
    }
    body.has-photo-bg .player-section {
      background: transparent;
      backdrop-filter: none;
    }
    body.has-photo-bg .wave-wrap,
    body.has-photo-bg .volume-slider {
      background: rgba(18, 26, 43, 0.82);
      backdrop-filter: blur(6px);
    }
    
  </style>
</head>
<body class="has-photo-bg">
  <div class="wrap">
    <header>
      <h1 id="title">Ljud i sommarnatten</h1>
    </header>

    <section class="card player-section">
      <div class="card-body player">
        <audio id="audio" class="audio-hidden" preload="auto" autoplay playsinline></audio>
        <div class="wave-wrap" id="waveWrap">
          <canvas id="waveCanvas"></canvas>
          <canvas id="timelineCanvas"></canvas>
          <div id="playhead"></div>
          <button type="button" class="play-control" id="playControl" aria-label="Spela inspelning">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/>
            </svg>
          </button>
          <div class="volume-slider" id="volumeSlider" aria-label="Volym">
            <div class="volume-track" id="volumeTrack">
              <div class="volume-fill" id="volumeFill"></div>
              <button type="button" class="volume-thumb" id="volumeThumb" aria-label="Volym"></button>
            </div>
          </div>
          <div class="scrub-bar" id="scrubBar" aria-label="Sök i inspelningen">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>
        <div class="legend" id="legend"></div>
      </div>
    </section>

    <footer>
      Fågelidentifiering med <a href="https://birdnet.cornell.edu" target="_blank" rel="noopener">BirdNET</a> (Cornell Lab of Ornithology).
    </footer>
  </div>

  <script>
    (async function () {
    const COLORS = [
      "#6ee7b7", "#fbbf24", "#60a5fa", "#f472b6", "#a78bfa",
      "#34d399", "#fb7185", "#38bdf8", "#f59e0b", "#c084fc",
      "#4ade80", "#fda4af", "#93c5fd", "#fcd34d", "#86efac"
    ];

    const data = await (await fetch("results.json")).json();
    const audio = document.getElementById("audio");
    const waveCanvas = document.getElementById("waveCanvas");
    const timelineCanvas = document.getElementById("timelineCanvas");
    const playhead = document.getElementById("playhead");
    const duration = data.duration_seconds;

    function getDuration() {
      return Number.isFinite(audio.duration) && audio.duration > 0
        ? audio.duration
        : duration;
    }

    async function setupAudio() {
      const audioUrl = "Midsummer Canopy.mp3";
      try {
        const response = await fetch(audioUrl);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const buffer = await response.arrayBuffer();
        const mime = response.headers.get("content-type") || "audio/mpeg";
        audio.src = URL.createObjectURL(new Blob([buffer], { type: mime }));
      } catch {
        audio.src = audioUrl;
      }
    }

    let audioReady = false;
    function startAutoplay() {
      if (audioReady) {
        return;
      }
      audioReady = true;
      document.getElementById("totalTime").textContent = formatTime(audio.duration || duration);
      drawWaveform();
      updatePlayhead();
      audio.play().catch(() => {});
    }

    function seekToRatio(ratio) {
      const target = Math.max(0, Math.min(1, ratio)) * getDuration();
      audio.currentTime = target;
      return target;
    }

    function togglePlayback() {
      if (audio.paused) {
        audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function syncPlayingState() {
      setPlayingState(!audio.paused && !audio.ended);
    }

    function setPlayingState(isPlaying) {
      const playControl = document.getElementById("playControl");
      playControl.classList.toggle("is-playing", isPlaying);
      playControl.setAttribute(
        "aria-label",
        isPlaying ? "Pausa inspelning" : "Spela inspelning"
      );
    }

    const DISPLAY_MIN_CONFIDENCE = 0.5;
    const PLAYBACK_LEAD_IN = Number(data.meta?.playback_lead_in_seconds) || 0;

    function isPastLeadIn(det) {
      return det.start >= PLAYBACK_LEAD_IN;
    }
    const colorBySpecies = new Map();
    const speciesCount = new Map();
    const speciesLane = new Map();
    const legendHolds = new Map();
    const LEGEND_TOP_COUNT = 8;

    const speciesByScientificName = new Map(
      data.summary.map((species) => [species.scientific_name, species])
    );

    const detectionsBySpecies = new Map();
    for (const det of data.detections) {
      if (det.confidence < DISPLAY_MIN_CONFIDENCE || !isPastLeadIn(det)) {
        continue;
      }
      const list = detectionsBySpecies.get(det.scientific_name) ?? [];
      list.push(det);
      detectionsBySpecies.set(det.scientific_name, list);
    }
    for (const list of detectionsBySpecies.values()) {
      list.sort((a, b) => a.start - b.start || b.confidence - a.confidence);
    }

    const firstIdentificationBySpecies = new Map();
    for (const det of data.detections) {
      if (det.confidence < DISPLAY_MIN_CONFIDENCE || !isPastLeadIn(det)) {
        continue;
      }
      const firstSeen = firstIdentificationBySpecies.get(det.scientific_name);
      if (firstSeen === undefined || det.start < firstSeen) {
        firstIdentificationBySpecies.set(det.scientific_name, det.start);
      }
    }

    const introducedSpecies = [];
    const introducedSet = new Set();
    let introducedSpeciesKey = "";

    function ensureSpeciesColor(species) {
      if (!colorBySpecies.has(species.scientific_name)) {
        const index = introducedSpecies.length;
        colorBySpecies.set(species.scientific_name, COLORS[index % COLORS.length]);
        speciesCount.set(species.scientific_name, species.count);
      }
    }

    function introduceSpecies(scientificName) {
      if (introducedSet.has(scientificName)) {
        return;
      }
      const species = speciesByScientificName.get(scientificName);
      if (!species) {
        return;
      }
      introducedSet.add(scientificName);
      introducedSpecies.push(species);
      ensureSpeciesColor(species);
    }

    function getActiveDetections(currentTime) {
      if (currentTime < PLAYBACK_LEAD_IN) {
        return [];
      }
      return data.detections.filter(
        (det) =>
          isPastLeadIn(det) &&
          currentTime >= det.start &&
          currentTime <= det.end &&
          det.confidence >= DISPLAY_MIN_CONFIDENCE
      );
    }

    function pickSpotlightDetections(active) {
      if (!active.length) {
        return [];
      }

      const bestBySpecies = new Map();
      for (const det of active) {
        const existing = bestBySpecies.get(det.scientific_name);
        if (!existing || det.confidence > existing.confidence) {
          bestBySpecies.set(det.scientific_name, det);
        }
      }

      const ranked = [...bestBySpecies.values()].sort(
        (a, b) => b.confidence - a.confidence
      );
      const activeCount = ranked.length;
      const topConfidence = ranked[0].confidence;
      let maxSpotlights = 1;
      if (activeCount >= 8) {
        maxSpotlights = 6;
      } else if (activeCount >= 5) {
        maxSpotlights = 4;
      } else if (activeCount >= 3) {
        maxSpotlights = 3;
      } else if (activeCount === 2) {
        maxSpotlights = 2;
      }

      const closeGap = activeCount >= 5 ? 0.18 : 0.1;
      const picked = [];
      for (const det of ranked) {
        if (!picked.length) {
          picked.push(det);
          continue;
        }
        if (picked.length >= maxSpotlights) {
          break;
        }
        if (topConfidence - det.confidence <= closeGap) {
          picked.push(det);
        }
      }
      return picked;
    }

    function introduceIdentifiedSpecies(currentTime) {
      if (currentTime < PLAYBACK_LEAD_IN) {
        return;
      }
      for (const [scientificName, firstSeen] of firstIdentificationBySpecies) {
        if (currentTime >= firstSeen) {
          introduceSpecies(scientificName);
        }
      }
    }

    function getSortedIntroducedSpecies() {
      return [...introducedSpecies].sort((a, b) => {
        const firstA = firstIdentificationBySpecies.get(a.scientific_name) ?? Infinity;
        const firstB = firstIdentificationBySpecies.get(b.scientific_name) ?? Infinity;
        return firstA - firstB || b.count - a.count || b.max_confidence - a.max_confidence;
      });
    }

    function updateSpeciesLanes(visibleSpecies) {
      speciesLane.clear();
      visibleSpecies.forEach((species, index) => {
        speciesLane.set(species.scientific_name, index);
      });
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${mins}:${secs}`;
    }

    function setupHeader() {
      const title = document.getElementById("title");
      title.textContent = data.audio_file;
      title.title = data.audio_file;
    }

    function renderDetectionMenuItem(det) {
      const endLabel = det.end > det.start + 0.5 ? `–${formatTime(det.end)}` : "";
      return `<li><button type="button" class="legend-menu-item" data-start="${det.start}"><span class="legend-menu-time">${formatTime(det.start)}${endLabel}</span><span class="legend-menu-confidence">${Math.round(det.confidence * 100)}%</span></button></li>`;
    }

    const birdImageCache = new Map();

    async function fetchBirdImage(scientificName) {
      if (birdImageCache.has(scientificName)) {
        return birdImageCache.get(scientificName);
      }
      const request = (async () => {
        try {
          const searchUrl =
            "https://www.wikidata.org/w/api.php?action=wbsearchentities" +
            `&search=${encodeURIComponent(scientificName)}&language=en&format=json&origin=*`;
          const searchData = await (await fetch(searchUrl)).json();
          const entity = searchData.search?.[0];
          if (!entity) {
            return null;
          }
          const entityData = await (
            await fetch(`https://www.wikidata.org/wiki/Special:EntityData/${entity.id}.json`)
          ).json();
          const claims = entityData.entities?.[entity.id]?.claims?.P18;
          if (!claims?.length) {
            return null;
          }
          const fileName = claims[0].mainsnak.datavalue.value;
          const filePath = encodeURIComponent(fileName.replace(/ /g, "_"));
          return {
            thumbUrl: `https://commons.wikimedia.org/wiki/Special:FilePath/${filePath}?width=240`,
            fileName,
            label: entity.label || scientificName,
            commonsUrl: `https://commons.wikimedia.org/wiki/File:${filePath}`,
          };
        } catch {
          return null;
        }
      })();
      birdImageCache.set(scientificName, request);
      return request;
    }

    async function loadMenuPhoto(entry) {
      const header = entry.querySelector(".legend-menu-header");
      const image = entry.querySelector(".legend-menu-photo");
      const credit = entry.querySelector(".legend-menu-credit");
      if (!header || !image || !credit || header.dataset.loaded === "true") {
        return;
      }
      header.dataset.loaded = "true";
      const result = await fetchBirdImage(header.dataset.scientific);
      if (!result) {
        header.hidden = true;
        return;
      }
      image.addEventListener(
        "load",
        () => {
          const scrollArea = entry.querySelector(".legend-menu-scroll");
          if (scrollArea) {
            scrollArea.scrollTop = 0;
          }
        },
        { once: true }
      );
      image.src = result.thumbUrl;
      image.alt = result.label;
      image.hidden = false;
      credit.innerHTML =
        `Foto: <a href="${result.commonsUrl}" target="_blank" rel="noopener">Wikimedia Commons</a>`;
    }

    function renderLegendEntry(species, index) {
      const color = colorBySpecies.get(species.scientific_name);
      const minorClass = index >= LEGEND_TOP_COUNT ? " minor" : "";
      const detections = detectionsBySpecies.get(species.scientific_name) ?? [];
      const menuItems = detections.map(renderDetectionMenuItem).join("");
      const photoHeader =
        `<li class="legend-menu-header" data-scientific="${species.scientific_name}">` +
        `<img class="legend-menu-photo" alt="" hidden />` +
        `<span class="legend-menu-credit"></span></li>`;
      return `<div class="legend-entry"><button type="button" class="legend-item${minorClass}" data-species="${species.scientific_name}" aria-expanded="false" aria-haspopup="listbox"><span class="swatch" style="background:${color}"></span><span class="legend-label"><span class="legend-name">${species.common_name}</span><span class="legend-confidence"></span></span></button><ul class="legend-menu" hidden>${photoHeader}<li class="legend-menu-scroll" role="presentation"><ul class="legend-menu-items" role="listbox">${menuItems}</ul></li></ul></div>`;
    }

    function setupLegend() {
      document.getElementById("legend").innerHTML = "";
    }

    function updateLegend(currentTime) {
      introduceIdentifiedSpecies(currentTime);
      const spotlights = pickSpotlightDetections(getActiveDetections(currentTime));
      const visibleSpecies = getSortedIntroducedSpecies();
      const key = visibleSpecies.map((species) => species.scientific_name).join("|");
      if (key !== introducedSpeciesKey) {
        introducedSpeciesKey = key;
        closeLegendMenus();
        updateSpeciesLanes(visibleSpecies);
        document.getElementById("legend").innerHTML = visibleSpecies
          .map((species, index) => renderLegendEntry(species, index))
          .join("");
      }

      updateLegendHighlights(currentTime, spotlights);
    }

    function closeLegendMenus(exceptEntry = null) {
      document.querySelectorAll(".legend-entry").forEach((entry) => {
        if (entry === exceptEntry) {
          return;
        }
        entry.classList.remove("open");
        const button = entry.querySelector(".legend-item");
        const menu = entry.querySelector(".legend-menu");
        if (button) {
          button.setAttribute("aria-expanded", "false");
        }
        if (menu) {
          menu.hidden = true;
        }
      });
    }

    function seekToDetection(startSeconds) {
      const total = getDuration();
      if (total <= 0) {
        return;
      }
      const wasPaused = audio.paused;
      seekToRatio(startSeconds / total);
      updatePlayhead();
      if (wasPaused) {
        audio.play().catch(() => {});
      }
    }

    function setupLegendMenus() {
      const legend = document.getElementById("legend");

      legend.addEventListener(
        "wheel",
        (event) => {
          const menu = event.target.closest(".legend-menu");
          if (!menu || menu.hidden) {
            return;
          }
          const scrollArea = menu.querySelector(".legend-menu-scroll");
          if (!scrollArea || scrollArea.scrollHeight <= scrollArea.clientHeight) {
            return;
          }
          const delta = event.deltaY;
          const atTop = scrollArea.scrollTop <= 0;
          const atBottom =
            scrollArea.scrollTop + scrollArea.clientHeight >= scrollArea.scrollHeight - 1;
          if ((delta < 0 && atTop) || (delta > 0 && atBottom)) {
            return;
          }
          event.preventDefault();
          event.stopPropagation();
          scrollArea.scrollTop += delta;
        },
        { passive: false }
      );

      legend.addEventListener("click", (event) => {
        const menuItem = event.target.closest(".legend-menu-item");
        if (menuItem) {
          event.stopPropagation();
          seekToDetection(Number(menuItem.dataset.start));
          closeLegendMenus();
          return;
        }

        const button = event.target.closest(".legend-item");
        if (!button) {
          return;
        }

        event.stopPropagation();
        const entry = button.closest(".legend-entry");
        const menu = entry.querySelector(".legend-menu");
        const willOpen = menu.hidden;
        closeLegendMenus(willOpen ? entry : null);
        if (willOpen) {
          entry.classList.add("open");
          menu.hidden = false;
          button.setAttribute("aria-expanded", "true");
          loadMenuPhoto(entry);
        }
      });

      document.addEventListener("click", () => closeLegendMenus());
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeLegendMenus();
        }
      });
    }

    function holdAfterSeconds(confidence) {
      return 0.15 + confidence * confidence * 2.5;
    }

    function updateLegendHighlights(currentTime, spotlights) {
      const nextHolds = new Map();
      for (const det of spotlights) {
        const untilTime = currentTime + holdAfterSeconds(det.confidence);
        const existing = legendHolds.get(det.scientific_name);
        nextHolds.set(det.scientific_name, {
          untilTime: Math.max(untilTime, existing?.untilTime ?? 0),
          strength: Math.max(det.confidence, existing?.strength ?? 0),
        });
      }

      for (const [species, state] of legendHolds.entries()) {
        if (currentTime <= state.untilTime && !nextHolds.has(species)) {
          nextHolds.set(species, state);
        }
      }

      legendHolds.clear();
      for (const [species, state] of nextHolds.entries()) {
        if (currentTime <= state.untilTime) {
          legendHolds.set(species, state);
        }
      }

      document.querySelectorAll(".legend-item").forEach((item) => {
        const state = legendHolds.get(item.dataset.species);
        const isActive = Boolean(state);
        const confidenceEl = item.querySelector(".legend-confidence");
        item.classList.toggle("active", isActive);
        item.style.setProperty("--highlight-strength", isActive ? String(state.strength) : "0");
        if (confidenceEl) {
          confidenceEl.textContent = isActive
            ? `${Math.round(state.strength * 100)}%`
            : "";
        }
      });
    }

    function resizeCanvas(canvas, wrap) {
      const rect = wrap.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width: rect.width, height: rect.height };
    }

    function drawWaveform() {
      const wrap = document.getElementById("waveWrap");
      const { ctx, width, height } = resizeCanvas(waveCanvas, wrap);
      const peaks = data.waveform_peaks;
      const mid = height / 2;
      const barWidth = Math.max(1, width / peaks.length);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "rgba(157,176,211,0.85)";
      peaks.forEach((peak, index) => {
        const x = (index / (peaks.length - 1)) * width;
        const amp = peak * (height * 0.38);
        ctx.fillRect(x - barWidth / 2, mid - amp, barWidth, amp * 2);
      });
    }

    function drawDetectionOverlay(currentTime = 0) {
      const wrap = document.getElementById("waveWrap");
      const { ctx, width, height } = resizeCanvas(timelineCanvas, wrap);
      ctx.clearRect(0, 0, width, height);
      if (currentTime < PLAYBACK_LEAD_IN) {
        return;
      }

      const laneCount = Math.max(1, speciesLane.size);
      const topPad = 6;
      const laneHeight = Math.max(3, (height - topPad * 2) / laneCount);
      const sortedDetections = [...data.detections]
        .filter((det) => det.confidence >= DISPLAY_MIN_CONFIDENCE && isPastLeadIn(det))
        .sort((a, b) => {
          const countA = speciesCount.get(a.scientific_name) ?? 0;
          const countB = speciesCount.get(b.scientific_name) ?? 0;
          return countA - countB;
        });

      sortedDetections.forEach((det) => {
        if (det.end <= 0 || det.start >= duration || det.start > currentTime) {
          return;
        }
        const lane = speciesLane.get(det.scientific_name);
        if (lane === undefined) {
          return;
        }
        const start = Math.max(0, det.start);
        const end = Math.min(duration, det.end, currentTime);
        if (end <= start) {
          return;
        }
        const x = (start / duration) * width;
        const w = Math.max(2, ((end - start) / duration) * width);
        const y = topPad + lane * laneHeight;
        const alpha = Math.round(90 + det.confidence * 110)
          .toString(16)
          .padStart(2, "0");
        ctx.fillStyle = colorBySpecies.get(det.scientific_name) + alpha;
        ctx.fillRect(x, y, w, Math.max(2, laneHeight - 1));
      });
    }

    function updatePlayhead() {
      const wrap = document.getElementById("waveWrap");
      const total = getDuration();
      const ratio = total > 0 ? audio.currentTime / total : 0;
      playhead.style.left = `${ratio * wrap.clientWidth}px`;
      document.getElementById("currentTime").textContent = formatTime(audio.currentTime);
      updateLegend(audio.currentTime);
      drawDetectionOverlay(audio.currentTime);
    }

    function setupVolumeSlider() {
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeTrack = document.getElementById("volumeTrack");
      const volumeFill = document.getElementById("volumeFill");
      const volumeThumb = document.getElementById("volumeThumb");
      let isDragging = false;

      function setVolume(value) {
        const volume = Math.max(0, Math.min(1, value));
        audio.volume = volume;
        audio.muted = volume === 0;
        volumeFill.style.height = `${volume * 100}%`;
        volumeThumb.style.bottom = `${volume * 100}%`;
        volumeThumb.setAttribute("aria-valuenow", String(Math.round(volume * 100)));
      }

      function volumeFromClientY(clientY) {
        const rect = volumeTrack.getBoundingClientRect();
        const ratio = 1 - (clientY - rect.top) / rect.height;
        return Math.max(0, Math.min(1, ratio));
      }

      function stopDragging() {
        isDragging = false;
      }

      volumeSlider.addEventListener("pointerdown", (event) => event.stopPropagation());
      volumeSlider.addEventListener("click", (event) => event.stopPropagation());

      volumeTrack.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        isDragging = true;
        volumeTrack.setPointerCapture(event.pointerId);
        setVolume(volumeFromClientY(event.clientY));
      });

      volumeTrack.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        setVolume(volumeFromClientY(event.clientY));
      });

      volumeTrack.addEventListener("pointerup", stopDragging);
      volumeTrack.addEventListener("pointercancel", stopDragging);

      setVolume(0.72);
    }

    function setupInteractions() {
      setupVolumeSlider();

      const playControl = document.getElementById("playControl");
      const scrubBar = document.getElementById("scrubBar");
      let isScrubbing = false;

      function ratioFromScrubBar(event) {
        const rect = scrubBar.getBoundingClientRect();
        return Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
      }

      function seekFromScrub(event) {
        const wasPaused = audio.paused;
        seekToRatio(ratioFromScrubBar(event));
        updatePlayhead();
        if (!wasPaused && audio.paused) {
          audio.play().catch(() => {});
        }
      }

      playControl.addEventListener("click", (event) => {
        event.stopPropagation();
        togglePlayback();
      });

      scrubBar.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
        isScrubbing = true;
        scrubBar.setPointerCapture(event.pointerId);
        seekFromScrub(event);
      });

      scrubBar.addEventListener("pointermove", (event) => {
        if (!isScrubbing) {
          return;
        }
        seekFromScrub(event);
      });

      function stopScrubbing(event) {
        if (!isScrubbing) {
          return;
        }
        isScrubbing = false;
        if (scrubBar.hasPointerCapture(event.pointerId)) {
          scrubBar.releasePointerCapture(event.pointerId);
        }
      }

      scrubBar.addEventListener("pointerup", stopScrubbing);
      scrubBar.addEventListener("pointercancel", stopScrubbing);

      audio.addEventListener("play", syncPlayingState);
      audio.addEventListener("playing", syncPlayingState);
      audio.addEventListener("pause", syncPlayingState);
      audio.addEventListener("ended", syncPlayingState);
      syncPlayingState();
      audio.addEventListener("timeupdate", updatePlayhead);
      audio.addEventListener("loadedmetadata", startAutoplay, { once: true });
      window.addEventListener("resize", () => {
        drawWaveform();
        updatePlayhead();
      });
    }

    setupHeader();
    setupLegend();
    setupLegendMenus();
    setupInteractions();
    await setupAudio();
    if (audio.readyState >= 1) {
      startAutoplay();
    }
    })();
  </script>
</body>
